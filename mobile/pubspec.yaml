name: smartiva_fieldops
description: Offline field briefings and site inventory for Smartiva Technologies LLP.
publish_to: none
version: 0.5.1+3

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  record: ^6.1.2
  xml: ^7.0.1
  crypto: ^3.0.6
  uuid: ^4.5.2
  http: ^1.5.0
  http_parser: ^4.1.2
  connectivity_plus: ^7.0.0
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/domain_v1.sql
